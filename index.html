<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Ads Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.mar-app{--bg:#F4F5F7;--card:#fff;--ink:#15171C;--ink2:#555B67;--ink3:#636975;--line:#E3E5EA;--line2:#EEF0F3;--acc:#2F54EB;--acc-d:#1D3BC2;--acc-soft:#EBEFFF;
  --g:#17804A;--g-soft:#E3F4EA;--y:#9A5B05;--y-soft:#FCF0DC;--r:#C0352F;--r-soft:#FCE8E7;--n-soft:#EEF0F3;--side:232px;
  font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.mar-app *{box-sizing:border-box}
.mar-app [hidden]{display:none!important}
.mar-app button,.mar-app input,.mar-app select,.mar-app textarea{font:inherit;color:inherit}
.mar-app button{cursor:pointer}
.mar-app a{color:var(--acc);text-decoration:none}
.mar-app a:hover{color:var(--acc-d)}
.mar-app h1,.mar-app h2,.mar-app h3{margin:0}
.mar-app h2{font-size:15px;font-weight:600}
.mar-app h3{font-size:14px;font-weight:600}
.mar-app .muted{color:var(--ink2)}
.mar-app .small{font-size:12px}
.mar-app .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ---------- login ---------- */
.mar-app .login{max-width:380px;margin:12vh auto;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.mar-app .login h1{font-size:20px;margin-bottom:4px}
.mar-app .login label{display:block;font-size:12px;color:var(--ink2);margin:14px 0 4px;font-weight:500}
.mar-app .inp{width:100%;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.mar-app .inp:focus,.mar-app select:focus-visible,.mar-app button:focus-visible,.mar-app a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mar-app select.inp{width:auto;padding:0 8px}
.mar-app .btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.mar-app .btn:hover{border-color:#C9CDD5}
.mar-app .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.mar-app .btn.pri:hover{background:var(--acc-d)}
.mar-app .btn.sm{height:32px;padding:0 10px;font-size:12px}
.mar-app .btn.ghost{border-style:dashed;color:#3A3F49;font-weight:500}
.mar-app .err{color:var(--r);font-size:13px;margin-top:10px}

/* ---------- app shell ---------- */
.mar-app .app{display:flex;min-height:100vh}
.mar-app .side{flex:0 0 var(--side);width:var(--side);position:sticky;top:0;height:100vh;overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;transition:width .18s ease,flex-basis .18s ease}
.mar-app .brand{display:flex;align-items:center;gap:10px;padding-left:8px}
.mar-app .logo{width:32px;height:32px;flex:0 0 32px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.mar-app .brand-t{flex:1;min-width:0}
.mar-app .brand-t b{display:block;font-size:15px}
.mar-app .brand-t span{font-size:12px;color:var(--ink3)}
.mar-app .sbt{width:32px;height:32px;flex:0 0 32px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.mar-app .nav{display:flex;flex-direction:column;gap:14px}
.mar-app .navg{display:flex;flex-direction:column;gap:2px}
.mar-app .navl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:0 10px 6px}
.mar-app .nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:9px 10px;border-radius:8px;color:#3A3F49;font-weight:500}
.mar-app .nav a:hover{background:#F4F5F7;color:var(--ink)}
.mar-app .nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.mar-app .nav a svg{flex:0 0 18px}
.mar-app .nav .lbl{flex:1;white-space:nowrap}
.mar-app .bdg{font-size:11px;font-weight:700;background:var(--r-soft);color:var(--r);padding:1px 7px;border-radius:999px}
.mar-app .sb-foot{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mar-app .sb-stat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.mar-app .sb-stat i{width:8px;height:8px;border-radius:50%;background:var(--g);flex:0 0 8px}
.mar-app .sb-btns{display:flex;gap:6px}
.mar-app .sb-btns .btn{flex:1;height:36px}
/* collapsed */
.mar-app.sbc .side{--side:68px;padding:20px 12px}
.mar-app.sbc .brand{flex-direction:column;padding-left:0}
.mar-app.sbc .brand-t,.mar-app.sbc .navl,.mar-app.sbc .nav .lbl,.mar-app.sbc .nav .bdg,.mar-app.sbc .sb-txt{display:none}
.mar-app.sbc .navg+.navg{border-top:1px solid var(--line2);padding-top:10px}
.mar-app.sbc .nav a{justify-content:center;padding:0;width:42px;margin:0 auto;position:relative}
.mar-app.sbc .nav a .dotb{display:block}
.mar-app .nav a .dotb{display:none;position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--r)}
.mar-app.sbc .sb-foot{border:0;padding:0;align-items:center}
.mar-app.sbc .sb-btns{flex-direction:column}
.mar-app.sbc .sb-btns .btn{flex:0 0 38px;height:38px;width:42px;padding:0}
.mar-app .sb-ico{display:none}
.mar-app.sbc .sb-ico{display:inline}

.mar-app .main{flex:1 1 auto;min-width:0;padding:24px 32px 56px}
.mar-app .wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mar-app .ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.mar-app .ph h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.mar-app .ph .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.mar-app .ph-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mar-app .seg{display:inline-flex;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.mar-app .seg button{height:32px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#3A3F49;font-size:13px;white-space:nowrap}
.mar-app .seg button:hover{background:#F4F5F7}
.mar-app .seg button.on{background:var(--ink);color:#fff;font-weight:600}
.mar-app .seg.soft{background:#F1F3F6;border:0;border-radius:8px}
.mar-app .seg.soft button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mar-app .seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.mar-app .per{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 4px 0 10px;min-height:40px;flex-wrap:wrap}
.mar-app .per>span{font-size:13px;color:var(--ink2)}
.mar-app .per select{border:0;background:transparent;font-weight:600;height:36px}
.mar-app .per input{border:1px solid var(--line);border-radius:6px;height:30px;padding:0 6px;font-size:12px}

/* ---------- cards & common ---------- */
.mar-app .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.mar-app .card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.mar-app .grid{display:grid;gap:12px}
.mar-app .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.mar-app .two{grid-template-columns:1fr 1fr}
.mar-app .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.mar-app .row>.grow{flex:999 1 520px;min-width:0}
.mar-app .row>.side-col{flex:1 1 330px;min-width:0}
.mar-app .row>.rail{flex:1 1 270px;min-width:0;max-width:340px}
.mar-app .kpi{display:flex;flex-direction:column;gap:3px}
.mar-app .kpi .lab{font-size:12px;color:var(--ink2);font-weight:500}
.mar-app .kpi .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mar-app .kpi .sub{font-size:12px;color:var(--ink3)}
.mar-app .card.kpi{padding:16px}
.mar-app .up{color:var(--g);font-weight:600} .mar-app .dn{color:var(--r);font-weight:600} .mar-app .flat{color:var(--ink3)}
.mar-app .sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:8px 0 0}
.mar-app .sec-h h2{font-size:15px}

/* table */
.mar-app .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.mar-app .card .tw{border:0;border-radius:0;margin:0 -20px -18px}
.mar-app .bhc .tw,.mar-app .lbpat .tw{margin-bottom:0}
.mar-app table{border-collapse:collapse;width:100%;font-size:13px}
.mar-app th{background:#FAFBFC;text-align:left;font-weight:600;font-size:12px;color:var(--ink2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.mar-app th[data-sort]{cursor:pointer;user-select:none}
.mar-app th.num{text-align:right}
.mar-app th:first-child,.mar-app td:first-child{padding-left:16px}
.mar-app th:last-child,.mar-app td:last-child{padding-right:16px}
.mar-app td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.mar-app tr:last-child td{border-bottom:0}
.mar-app tbody tr.click{cursor:pointer}
.mar-app tbody tr.click:hover td{background:#F8F9FB}
.mar-app tbody tr.sel td{background:#F5F7FF}
.mar-app tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.mar-app .bl{border-left:1px solid var(--line2)}
.mar-app .nm{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mar-app .chip{display:inline-block;padding:2px 7px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.mar-app .c-g{background:var(--g-soft);color:var(--g)} .mar-app .c-y{background:var(--y-soft);color:var(--y)}
.mar-app .c-r{background:var(--r-soft);color:var(--r)} .mar-app .c-n{background:var(--n-soft);color:var(--ink2)}
.mar-app .c-b{background:var(--acc-soft);color:var(--acc)}
.mar-app .tag{display:inline-block;white-space:nowrap;flex:0 0 auto;padding:2px 6px;border-radius:5px;font-size:11px;font-weight:600;background:var(--n-soft);color:var(--ink2);margin-right:6px;vertical-align:1px}
.mar-app .why{font-size:12px;color:var(--ink2);min-width:220px}
.mar-app .sub2{font-size:12px;color:var(--ink3);margin-top:2px}

/* alerts */
.mar-app .alist{display:flex;flex-direction:column}
.mar-app .al{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line2);cursor:pointer;color:var(--ink);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.mar-app .al:first-child{border-top:0}
.mar-app .al:hover b{color:var(--acc)}
.mar-app .al .dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:6px}
.mar-app .al.r .dot{background:var(--r)} .mar-app .al.y .dot{background:#C98A1B} .mar-app .al.b .dot{background:var(--acc)}
.mar-app .al b{font-size:13px;display:block}
.mar-app .al span.w{font-size:12px;color:var(--ink2)}

/* callouts & banners */
.mar-app .callout{padding:12px 14px;border-radius:10px;background:var(--acc-soft);color:#1F3A9E;font-size:13px}
.mar-app .callout.r{background:var(--r-soft);color:#8E2420} .mar-app .callout.g{background:var(--g-soft);color:#14663a} .mar-app .callout.y{background:var(--y-soft);color:#7A4804}
.mar-app .banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--r-soft);color:#8E2420;border-radius:10px;padding:10px 14px;font-size:13px}
.mar-app .banner a{color:#8E2420;font-weight:600;text-decoration:underline}

/* decision */
.mar-app .ctabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.mar-app .ctab{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);text-align:left}
.mar-app .ctab.on{border:2px solid var(--ink);padding:11px 13px}
.mar-app .ctab .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.mar-app .ctab .t i{width:8px;height:8px;border-radius:50%}
.mar-app .ctab .t b{margin-left:auto;font-size:18px;font-variant-numeric:tabular-nums}
.mar-app .ctab .s{font-size:12px;color:var(--ink3)}
.mar-app .dp{display:flex;flex-direction:column;gap:14px}
.mar-app .dp-act{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.mar-app .dp-act .k{font-size:12px;font-weight:700;letter-spacing:.03em}
.mar-app .dp-act .a{font-size:20px;font-weight:700}
.mar-app .dp-act.c-r{color:#8E2420} .mar-app .dp-act.c-g{color:#14663a} .mar-app .dp-act.c-y{color:#7A4804} .mar-app .dp-act.c-b{color:#1F3A9E}
.mar-app .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mar-app .tile{border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.mar-app .tile .l{font-size:11px;color:var(--ink3)}
.mar-app .tile .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.mar-app dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.mar-app dl.kv dt{color:var(--ink3)} .mar-app dl.kv dd{margin:0;text-align:right;font-weight:600}
.mar-app .btns{display:flex;flex-wrap:wrap;gap:8px}
.mar-app .btns .btn{flex:1 1 120px;height:40px}
.mar-app .tw.scroll{max-height:640px;overflow:auto}
.mar-app .tw.scroll thead th{position:sticky;top:0;z-index:2;background:#F7F8FA;box-shadow:inset 0 -1px 0 var(--line)}
.mar-app .tw.scroll tfoot td{position:sticky;bottom:0;z-index:2;background:#F7F8FA;font-weight:700;box-shadow:inset 0 1px 0 var(--line)}
.mar-app .tw.scroll td:first-child,.mar-app .tw.scroll th:first-child{position:sticky;left:0;z-index:1;background:var(--card)}
.mar-app .tw.scroll thead th:first-child,.mar-app .tw.scroll tfoot td:first-child{z-index:3;background:#F7F8FA}
.mar-app tr.wkend td,.mar-app .tw.scroll tr.wkend td:first-child{background:#FBFBFC}
.mar-app .hs{box-shadow:inset 0 0 0 1.5px var(--g)}
.mar-app .c-r-t{color:var(--r)} .mar-app .c-g-t{color:var(--g)}
.mar-app .lbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.mar-app .lbc{display:flex;flex-direction:column;gap:8px;min-width:0}
.mar-app .lbh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.mar-app .lbh h3{font-size:15px;font-weight:700;margin:0}
.mar-app .lbh .seg button{height:28px;padding:0 10px;font-size:12px}
.mar-app .lbavg{font-size:12px;color:var(--ink3)}
.mar-app .lbl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mar-app .lbr{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:8px;background:none;border:0;text-align:left;color:var(--ink);cursor:pointer;overflow:hidden}
.mar-app .lbr:hover{background:#F4F5F7}
.mar-app .lbr .bar{position:absolute;left:0;top:0;bottom:0;background:var(--acc-soft);opacity:.6;border-radius:8px;z-index:0;pointer-events:none}
.mar-app .lbr>span:not(.bar){position:relative;z-index:1}
.mar-app .lbr .rk{width:18px;flex:none;font-size:12px;font-weight:700;color:var(--ink3);text-align:center}
.mar-app .lbr .th{width:34px;height:34px;flex:none;border-radius:6px;background:var(--n-soft);overflow:hidden}
.mar-app .lbr .th img{width:100%;height:100%;object-fit:cover;display:block}
.mar-app .lbr .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mar-app .lbr .nm small{display:block;font-weight:400;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.mar-app .lbr .val{flex:none}
.mar-app .lbpat summary{cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.mar-app .lbpat{margin-bottom:14px}
.mar-app .ccard .cmet{font-size:12px;color:var(--ink3)}
.mar-app .rmeter{display:flex;flex-direction:column;gap:4px;min-width:120px}
.mar-app .rmeter .bar{height:6px;border-radius:3px;background:var(--n-soft);overflow:hidden}
.mar-app .rmeter .bar i{display:block;height:100%;border-radius:3px}
.mar-app .rmeter .lbl span{white-space:nowrap}
.mar-app .rmeter .lbl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mar-app .rbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mar-app .sop-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.mar-app .sop-sum .card{display:flex;align-items:baseline;gap:8px;padding:12px 14px;flex-wrap:wrap}
.mar-app .sop-sum b{font-size:22px}
.mar-app .sop-asc{margin-bottom:14px;border-color:#BFD0FF}
.mar-app .sop-mv{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.mar-app .sop-mv ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.mar-app .sop-c{margin-bottom:10px;padding:14px 16px}
.mar-app .sop-c>summary{cursor:pointer;list-style:none}
.mar-app .sop-c>summary::-webkit-details-marker{display:none}
.mar-app .sop-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.mar-app .sop-k{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mar-app .sop-k>span:not(.chip){display:flex;flex-direction:column;font-size:13px}
.mar-app .sop-k small{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
.mar-app .sop-act{font-size:13px;padding:5px 12px}
.mar-app .sop-ck{margin-bottom:14px}
.mar-app .sop-sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.mar-app .sop-sl>div{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px;position:relative}
.mar-app .sop-sl>div b{font-size:16px}
.mar-app .sop-sl>div.past{opacity:.55}
.mar-app .sop-sl>div.now{border-color:var(--acc);background:#F2F5FF}
.mar-app .sop-sl i{position:absolute;top:8px;right:10px;font-style:normal;font-size:11px;font-weight:700;color:var(--acc)}
.mar-app .sop-n{font-weight:600;color:var(--ink)}
.mar-app .fj{margin-bottom:16px;padding:18px 20px}
.mar-app .fj-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:14px}
.mar-app .fj-scroll{overflow-x:auto}
.mar-app .fj-g{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));min-width:820px;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.mar-app .fj-c{display:flex;flex-direction:column;background:#fff}
.mar-app .fj-c+.fj-c{border-left:1px solid var(--line2)}
.mar-app .fj-c.leak{background:#FFF8F7}
.mar-app .fj-h{padding:14px 14px 0;display:flex;flex-direction:column;gap:2px;min-height:92px}
.mar-app .fj-n{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.mar-app .fj-v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.mar-app .fj-b{height:150px;display:flex;align-items:flex-end;gap:6px;padding:0 14px}
.mar-app .fj-b i{flex:1;border-radius:6px 6px 0 0;display:block}

  acc: LS.get('acc', -1), preset: LS.get('preset', '7d'), since: LS.get('since', null), until: LS.get('until', null),
  page: ({ pixel: 'audit' })[LS.get('page', 'today')] || LS.get('page', 'today'), diagCamp: '', showInactive: false,
  audit: null, acts: null, reach7: null, rs: {}, decLevel: LS.get('decLevel', 'campaign'), trQ: '',
  pace: 'spend', decCls: 'all', decSel: null, cview: LS.get('cview', 'grid'), audSel: null, audTab: 'opt', pv: null, pvCache: {},
  tr: Object.assign({ level: 'campaign', mode: 'multi', ids: [], metrics: ['roas', 'cpa', 'ctr', 'cpm'], metric: 'roas', smooth: 3, gran: 'day', days: 30 }, LS.get('tr', {})),
  cf: LS.get('cf', { minCtr: 0, cheap: false, minPurch: 0, roasOk: false, scored: false, q: '' }),
  sort: {}, busy: false };
const M = { spend: 0, impr: 1, reach: 2, clicks: 3, link: 4, lpv: 5, atc: 6, ic: 7, purch: 8, val: 9, contact: 10, plays: 11, p25: 12, p50: 13, p75: 14, p100: 15, thru: 16, lead: 17 };

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);

  if (a >= 1e9) return 'Rp' + (v / 1e9).toFixed(2).replace('.', ',') + 'M';
  if (a >= 999500) return 'Rp' + (v / 1e6).toFixed(a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2).replace('.', ',') + 'jt';
  if (a >= 1e3) return 'Rp' + Math.round(v / 1e3) + 'rb';

function todayJkt() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function hourJkt() { return parseInt(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jakarta', hour: '2-digit', hour12: false }).format(new Date()), 10) % 24; }
function addD(s, n) { if (!s) s = todayJkt(); const p = String(s).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n, 12)).toISOString().slice(0, 10); }
function diffD(a, b) { return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5); }
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function fd(s) { if (!s || s === 'lifetime') return 'Lifetime'; const p = s.split('-'); return +p[2] + ' ' + BULAN[+p[1] - 1]; }
function roasCls(r) { return !fin(r) ? 'c-n' : r >= S.minRoas ? 'c-g' : r >= S.cutoff ? 'c-y' : 'c-r'; }
function roasChip(r, spend) { if (!spend) return '<span class="chip c-n">–</span>'; return `<span class="chip ${roasCls(r)}">${xx(r)}</span>`; }
function delta(cur, prev, higherBetter = true) {
  if (!fin(cur) || !fin(prev) || prev === 0) return '<span class="flat">–</span>';
  const d = cur / prev - 1; if (Math.abs(d) < 0.005) return '<span class="flat">0%</span>';
  const good = (d > 0) === higherBetter;
  return `<span class="${good ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d * 100).toFixed(0)}%</span>`;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 2600); }
function copy(txt) { try { navigator.clipboard.writeText(txt).then(() => toast('Disalin: ' + txt), () => toast(txt)); } catch (e) { toast(txt); } }
const OFFSET1 = { IDR: 1, JPY: 1, KRW: 1, VND: 1, CLP: 1, COP: 1, CRC: 1, HUF: 1, ISK: 1, PYG: 1, TWD: 1 };
function budgetOf(amount, accIdx, ds) { if (!amount) return 0; const cur = (ds.accounts[accIdx] || {}).cur || 'IDR'; return OFFSET1[cur] ? amount : amount / 100; }

/* ---------- API ---------- */
async function api(action, params = {}) {
  if (!API) throw new Error('URL Web App belum diisi');
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action, session: SESSION }, params)) });
  let j; try { j = await r.json(); } catch (e) { throw new Error('Respon server tidak valid (HTTP ' + r.status + ')'); }

}

/* ---------- data prep & aggregation ---------- */
function prep(ds) {
  if (!ds || ds._prep) return ds;
  ds._prep = true;
  ds.adsByCamp = {};
  ds.ads.forEach((a, i) => { (ds.adsByCamp[a.c] = ds.adsByCamp[a.c] || []).push(i); });
  ds.campIds = Object.keys(ds.campaigns);
  ds._adById = {}; ds._concept = {};
  ds.ads.forEach(a => { ds._adById[a.id] = a; const k = a.a + '|' + conceptKey(a.n); if (ds._concept[k] == null) ds._concept[k] = String(a.n || '').replace(/\s*[–—-]\s*Copy.*$/i, '').replace(/^\s*\d{1,2}\s?[A-Za-z]{3}\s?\d{2,4}\s+/, '').trim() || a.n; });
  return ds;
}
function idxRange(ds, since, until) {
  if (ds.lifetime) return [0, 0];
  let lo = Infinity, hi = -1;
  ds.dates.forEach((d, i) => { if (d >= since && d <= until) { if (i < lo) lo = i; if (i > hi) hi = i; } });
  return [lo, hi];
}
/** jumlahkan baris → Map(key → vektor 17 metrik) */
function agg(ds, since, until, keyFn, acc = ST.acc) {
  const [lo, hi] = idxRange(ds, since, until), out = new Map();
  if (hi < 0) return out;
  for (const r of ds.rows) {
    if (r[0] < lo || r[0] > hi) continue;
    const ad = ds.ads[r[1]];
    if (acc >= 0 && ad.a !== acc) continue;
    const k = keyFn(ad, r); if (k == null) continue;
    let v = out.get(k); if (!v) { v = new Array(NM).fill(0); out.set(k, v); }
    for (let i = 0; i < NM; i++) v[i] += r[i + 2] || 0;
  }
  return out;
}
const Z = () => new Array(NM).fill(0);
function tot(ds, since, until, filt, acc) { return agg(ds, since, until, (ad, r) => (!filt || filt(ad, r)) ? 't' : null, acc).get('t') || Z(); }
function der(v) {
  return { spend: v[M.spend], impr: v[M.impr], purch: v[M.purch], val: v[M.val], link: v[M.link], lpv: v[M.lpv], ic: v[M.ic], contact: v[M.contact], lead: v[M.lead],
    roas: dv(v[M.val], v[M.spend]), cpa: dv(v[M.spend], v[M.purch]), cpm: dv(v[M.spend], v[M.impr]) * 1000,
    ctr: dv(v[M.link], v[M.impr]), ctrAll: dv(v[M.clicks], v[M.impr]), cLpv: dv(v[M.spend], v[M.lpv]),
    lpvRate: dv(v[M.lpv], v[M.link]), icRate: dv(v[M.ic], v[M.lpv]), close: dv(v[M.purch], v[M.ic]), aov: dv(v[M.val], v[M.purch]),
    hook: dv(v[M.p25], v[M.impr]), hold: dv(v[M.thru], v[M.impr]), r50: dv(v[M.p50], v[M.p25]), cpc: dv(v[M.spend], v[M.contact]) };

/* ---------- ambang sehat per akun (AOV & biaya trafik 30D + Settings) ---------- */
let TH_CACHE = null;
/** closing: purchase ÷ LPV (landing page) atau purchase ÷ kontak (campaign WA, LPV hampir 0) */
function closingOf(d) {
  if (d.lpv >= 10 && d.lpv >= d.contact) return { v: dv(d.purch, d.lpv), src: 'LP' };
  if (d.contact > 0) return { v: dv(d.purch, d.contact), src: 'WA' };
  return { v: dv(d.purch, d.lpv), src: 'LP' };
}
function TH(a) {
  const ds = ST.main; if (!ds) return null;
  const key = ds.gen + '|' + JSON.stringify([S.cutoff, S.minRoas, S.target, S.maxCpa, S.metric]);
  if (!TH_CACHE || TH_CACHE.key !== key) TH_CACHE = { key, m: {} };
  if (TH_CACHE.m[a]) return TH_CACHE.m[a];
  const t = todayJkt(), s = addD(t, -30), u = addD(t, -1), M2 = S.metric;
  const camps = agg(ds, s, u, ad => ad.c, a);
  let lpS = 0, lpV = 0, waP = 0, waC = 0;
  camps.forEach(v => { const d = der(v); if (d.lpv >= 10 && d.lpv >= d.contact) { lpS += d.spend; lpV += d.lpv; } else if (d.contact >= 5) { waP += d.purch; waC += d.contact; } });
  const base = maxCpa(a, ds) * S.minRoas;          // = AOV 30D (atau CPA maks manual × ROAS minimum)
  const cpa = { cut: base / S.cutoff, ok: base / S.minRoas, scale: base / S.target };
  const waClose = waC >= 30 ? waP / waC : M2.waClose / 100;
  const cLpv = lpV ? lpS / lpV : NaN;
  const r = { base, cpa, waClose, waAuto: waC >= 30, cLpv, junkLpv: fin(cLpv) ? Brain.cfg.content.junkMult * (cpa.ok / cLpv) : NaN,
    cpc: { cut: cpa.cut * waClose, ok: cpa.ok * waClose, scale: cpa.scale * waClose },
    closeLp: { cut: cLpv / cpa.cut, ok: cLpv / cpa.ok, scale: cLpv / cpa.scale },
    closeWa: { cut: waClose * 0.6, ok: waClose, scale: waClose * 1.25 },
    hook: { cut: M2.hookMin / 100, ok: M2.hookOk / 100, scale: M2.hookScale / 100 },

/** kelas warna: merah < batas minimum · kuning di antara · hijau ≥ sehat (biru tebal = layak scale) */
function hcls(kind, v, a, src) {

  if (!L || !fin(L.cut)) return 'c-n';

  return v >= L.scale ? 'c-g hs' : v >= L.ok ? 'c-g' : v >= L.cut ? 'c-y' : 'c-r';
}
function mchip(kind, v, a, txt, src) { return fin(v) ? `<span class="chip ${hcls(kind, v, a, src)}">${txt}</span>` : '<span class="chip c-n">–</span>'; }

  if (closingOf(d).src === 'LP') return `<span class="small muted" title="Campaign landing page — kontak bukan tujuan utama, jadi tidak dinilai">${rp(d.cpc)}</span>`;
  return mchip('cpc', d.cpc, a, rp(d.cpc));

/** keterangan warna ROAS yang tidak rusak walau minimum = cutoff */
function roasLegend() {

function diagJourney(A, B, hasPrev, ds, cid) {
  const st = [
    { n: 'Tayangan', a: A.impr, b: B.impr, f: v => nf(v), cv: d => dv(d.spend, d.impr) * 1000, cvF: v => 'CPM ' + rp(v), cvL: 'biaya per 1.000 tayang', cost: null, lowGood: true },
    { n: 'Landing page view', a: A.lpv, b: B.lpv, cv: d => dv(d.lpv, d.impr), cvL: 'dari tayangan', cost: d => dv(d.spend, d.lpv), costL: 'per LPV' },
    { n: 'Leads', a: A.lead, b: B.lead, cv: d => dv(d.lead, d.lpv), cvL: 'dari LPV', cost: d => dv(d.spend, d.lead), costL: 'per lead' },
    { n: 'Contacts', a: A.contact, b: B.contact, cv: d => dv(d.contact, d.lpv), cvL: 'dari LPV', cost: d => dv(d.spend, d.contact), costL: 'per contact' },
    { n: 'Checkout', a: A.ic, b: B.ic, cv: d => dv(d.ic, d.lpv), cvL: 'dari LPV', cost: d => dv(d.spend, d.ic), costL: 'per checkout' },
    { n: 'Purchase', a: A.purch, b: B.purch, cv: d => d.ic > 0 ? dv(d.purch, d.ic) : dv(d.purch, d.lpv), cvL: A.ic > 0 ? 'dari checkout' : 'dari LPV', cost: d => dv(d.spend, d.purch), costL: 'CPA' }

  // kebocoran: rasio konversi yang paling turun (butuh volume minimal)
  let leak = null;
  if (hasPrev) st.forEach((x, i) => { if (!i) return; const ca = x.cv(A), cb = x.cv(B);

function conceptKey(name) {

}
function buildConcepts(ds, s, u) {

  const G = new Map();
  per.forEach((v, ai) => {
    const ad = ds.ads[ai], key = ad.a + '|' + conceptKey(ad.n);
    let g = G.get(key); if (!g) { g = { key, a: ad.a, name: ad.n.replace(/\s*[–—-]\s*Copy.*$/i, '').replace(/^\s*\d{1,2}\s?[A-Za-z]{3}\s?\d{2,4}\s+/, '').trim() || ad.n, v: Z(), ads: [] }; G.set(key, g); }
    for (let i = 0; i < NM; i++) g.v[i] += v[i];
    g.ads.push({ ai, v });
  });
  const list = [...G.values()].map(g => { g.d = der(g.v); g.active = g.ads.filter(x => ds.ads[x.ai].st === 'ACTIVE');
    g.camps = [...new Set(g.active.map(x => ds.ads[x.ai].c))]; g.ok = g.d.purch >= 2 || g.d.spend >= 3e6; return g; });
  // skor persentil per akun

  Object.values(byAcc).forEach(arr => {
    const prc = f => { const vals = arr.map(g => fin(g.d[f]) ? g.d[f] : 0).sort((a, b) => a - b);
      return x => { const v = fin(x) ? x : 0; let lo = 0; while (lo < vals.length && vals[lo] < v) lo++; let hi = lo; while (hi < vals.length && vals[hi] === v) hi++; return vals.length > 1 ? ((lo + hi - 1) / 2) / (vals.length - 1) : 0.5; }; };
    const H = prc('hook'), D = prc('hold'), R = prc('r50'), O = prc('roas');
    arr.forEach(g => { g.score = Math.round(100 * (0.30 * H(g.d.hook) + 0.20 * D(g.d.hold) + 0.15 * R(g.d.r50) + 0.35 * O(g.d.roas)));

  return { list, med };
}

/** bandingkan jumlah baris per iklan dengan total akun (7 hari terakhir + hari ini) */
function syncCheck(ds, accs) {
  if (!ds.accDaily) return null;
  const t = todayJkt(); let days = 0, dp = 0, dsp = 0;
  for (let k = 0; k <= 7; k++) {
    const d = addD(t, -k); let ap = 0, as = 0, tp = 0, ts = 0;
    accs.forEach(i => { const r = (ds.accDaily[i] || {})[d]; if (r) { tp += r[3]; ts += r[0]; } const v = tot(ds, d, d, null, i); ap += v[M.purch]; as += v[M.spend]; });
    if (Math.abs(tp - ap) >= 1 || Math.abs(ts - as) > Math.max(1000, ts * 0.01)) { days++; dp += tp - ap; dsp += ts - as; }
  }
  return days ? { days, purch: Math.round(dp), spend: dsp } : null;
}

    const wd = [1, 2, 3, 4, 5, 6, 0].map(i => ({ n: AUD_DAY[i], d: aD(wk[i]) })), wmx = Math.max(1, ...wd.map(x => x.d.spend));

    const dead = blks.filter(b => b.d.spend > 0 && !b.d.p).sort((a, b) => b.d.spend - a.d.spend)[0];
    if (dead) finds.push(audFind('r', 'Jam kosong', `${dead.n}: ${rp(dead.d.spend)}, 0 purchase`, 'Pertimbangkan jadwal tayang (perlu budget lifetime) atau kurangi budget di jam ini.'));
    const gold = blks.filter(b => b.d.p >= 2).sort((a, b) => b.d.roas - a.d.roas).slice(0, 2);
    if (gold.length && H.p) { const gp = gold.reduce((s, b) => s + b.d.p, 0), gs = gold.reduce((s, b) => s + b.d.spend, 0);
      finds.push(audFind('g', 'Jam emas', `${gold.map(b => b.n.replace(/:00|:59/g, '')).join(' & ')}: ${pc(gp / H.p, 0)} purchase`, `Dari ${pc(gs / H.spend, 0)} spend. ROAS ${gold.map(b => af2(b.d.roas)).join(' dan ')} — jam terbaik untuk promo dan retargeting.`)); }
    const bd = wd.filter(x => x.d.spend).sort((a, b) => b.d.p - a.d.p || b.d.roas - a.d.roas)[0], wdw = wd.filter(x => x.d.spend).sort((a, b) => (a.d.roas || 0) - (b.d.roas || 0))[0];
    if (bd) finds.push(audFind('b', 'Hari terbaik', `${bd.n}: ${nf(bd.d.p)} purchase, ROAS ${af2(bd.d.roas)}`, wdw && wdw !== bd ? `${wdw.n} paling lemah (ROAS ${af2(wdw.d.roas || 0)}).` : ''));
  }

  if (S2.tab === 'dev') {
    const dm = B('dev'), D = aD([...dm.values()].reduce((s, v) => aAdd(s, v), AZ()));
    const rows = [...dm.entries()].map(([k, v]) => { const d = aD(v); return { k, d, idx: D.p && D.spend ? (d.p / D.p) / (d.spend / D.spend) : NaN, n: AUD_DEV[k] || esc(k) }; }).filter(x => x.d.spend > 0 || x.d.p > 0);
    const get = k => rows.find(x => x.k === k);
    const main = ['iphone', 'android_smartphone'].map(get).filter(Boolean);
    const card = x => `<div class="card aud-dc"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:17px">${x.k === 'iphone' ? 'iPhone' : 'Android'}</b>${roasChip(x.d.roas, x.d.spend)}</div>
      <div class="aud-dk"><div><div class="small muted">Spend</div><div class="v">${rp(x.d.spend)}</div><div class="small muted">${pc(x.d.spend / D.spend, 0)} dari total</div></div><div><div class="small" style="color:var(--acc)">Contacts</div><div class="v">${nf(x.d.ct)}</div><div class="small muted">${pc(D.ct ? x.d.ct / D.ct : NaN, 0)} dari total</div></div><div><div class="small muted">Purchase</div><div class="v">${nf(x.d.p)}</div><div class="small muted">${pc(D.p ? x.d.p / D.p : NaN, 0)} dari total</div></div></div>
      <div class="aud-dv"><span class="muted">CPM</span><b>${rp(x.d.cpm)}</b><span class="muted">Link CTR</span><b>${pc(x.d.ctr)}</b><span class="muted">Klik → sampai landing page</span><b>${pc(x.d.lpvR, 0)}</b><span class="muted">LPV → checkout</span><b>${pc(x.d.icR)}</b><span class="muted">Checkout → purchase</span><b>${pc(x.d.cp, 0)}</b><span class="muted">Closing (LPV → purchase)</span><b>${pc(x.d.close)}</b><span class="muted">CPA</span><b>${x.d.p ? rp(x.d.cpa) : '–'}</b></div></div>`;
    const noteOf = x => x.d.p < 3 ? (x.d.spend < D.spend * 0.01 ? 'Data tipis' : 'Belum cukup purchase') : x.d.roas >= D.roas * 1.2 ? 'Lebih efisien dari rata-rata' : x.d.roas < D.roas * 0.8 ? 'Lebih boros dari rata-rata' : 'Rata-rata';
    const tbl = `<div class="card"><div class="card-h"><b style="font-size:15px">Semua perangkat</b><span class="small muted">${S2.days} hari</span></div><div class="tw"><table><thead><tr><th>Perangkat</th><th class="num">Spend</th><th class="num">% spend</th><th class="num">CPM</th><th class="num">Link CTR</th><th class="num">LPV</th>${audCtTh}<th class="num">Checkout</th><th class="num">Purchase</th><th class="num">Closing</th><th class="num">CPA</th><th class="num">ROAS</th><th>Catatan</th></tr></thead><tbody>
      ${audSort(rows.slice()).map(x => `<tr><td style="font-weight:600;white-space:nowrap">${x.n}</td><td class="num">${rp(x.d.spend)}</td><td class="num muted">${pc(x.d.spend / D.spend, 1)}</td><td class="num">${rp(x.d.cpm)}</td><td class="num">${pc(x.d.ctr)}</td><td class="num">${nf(x.d.lpv)}</td>${audCtTd(x.d)}<td class="num">${nf(x.d.ic)}</td><td class="num">${nf(x.d.p)}</td><td class="num">${x.d.lpv ? pc(x.d.close) : '–'}</td><td class="num">${x.d.p ? rp(x.d.cpa) : '–'}</td><td class="num">${roasChip(x.d.roas, x.d.spend)}</td><td class="small" style="min-width:170px;white-space:normal">${noteOf(x)}</td></tr>`).join('')}</tbody></table></div></div>`;
    let mx = '', mrows = [];
    if (S2.cmp) {
      mrows = inc.map(x => { const o = (x.p.dev || {})[x.id] || {}; return { x, a: aD(o.android_smartphone), i: aD(o.iphone) }; }).filter(r => r.a.spend + r.i.spend > 0);
      const win = r => { if (r.a.p + r.i.p < 2) return 'Belum cukup data'; if (r.a.roas < S.cutoff && r.i.roas < S.cutoff) return 'Dua-duanya di bawah batas';
        const a = r.a.roas || 0, b = r.i.roas || 0; if (Math.abs(a - b) / Math.max(a, b, 1e-9) < 0.15) return 'Seimbang'; return a > b ? 'Android' : 'iPhone'; };
      const cell = d => `${roasChip(d.roas, d.spend)}<span class="small muted" style="display:block">${rp(d.spend)} · ${nf(d.p)} purchase</span>`;
      mx = `<div class="card"><div class="card-h"><b style="font-size:15px">Campaign × perangkat</b><span class="small muted">ROAS ${S2.days} hari</span></div><div class="tw"><table><thead><tr><th>Campaign</th><th class="num">Android</th><th class="num">iPhone</th><th class="num aud-ct">Contacts A / i</th><th>Yang lebih efisien</th></tr></thead><tbody>
        ${mrows.map(r => `<tr><td class="nm" style="font-weight:600">${shortCamp(r.x.n)}</td><td class="num">${cell(r.a)}</td><td class="num">${cell(r.i)}</td><td class="num aud-ct">${nf(r.a.ct)} / ${nf(r.i.ct)}</td><td class="small">${win(r)}</td></tr>`).join('')}</tbody></table></div></div>`;
    }
    body = `<div class="aud-g2">${main.map(card).join('')}</div>${tbl}${mx}<div class="small muted">Meta hanya membagi laporan per jenis perangkat (iPhone, Android, iPad, tablet Android, desktop). Merek dan model HP (Samsung, Oppo, iPhone 15, dll.) tidak tersedia di laporan iklan.</div>`;
    const ip = get('iphone'), an = get('android_smartphone');
    if (ip && an && ip.d.lpv >= 100 && an.d.lpv >= 100 && ip.d.p + an.d.p >= 3) {
      const [hi, lo] = ip.d.close >= an.d.close ? [ip, an] : [an, ip], nm = x => x === ip ? 'iPhone' : 'Android';
      finds.push(audFind('g', 'Lebih mudah closing', `${nm(hi)}: ${pc(hi.d.close)} LPV jadi purchase`, `${nm(lo)} cuma ${pc(lo.d.close)}${lo.d.close ? `. Pengguna ${nm(hi)} ${af2(hi.d.close / lo.d.close)}× lebih mungkin membeli setelah masuk landing page.` : '.'}`));
      const [lr, hr] = ip.d.lpvR <= an.d.lpvR ? [ip, an] : [an, ip];
      if (fin(lr.d.lpvR) && hr.d.lpvR - lr.d.lpvR >= 0.1) finds.push(audFind('r', 'Kebocoran', `${nm(lr)}: ${pc(1 - lr.d.lpvR, 0)} klik tidak sampai landing page`, `Tingkat LPV ${pc(lr.d.lpvR, 0)} vs ${nm(hr)} ${pc(hr.d.lpvR, 0)}. Cek kecepatan landing page di HP ${nm(lr)}.`));
      else finds.push(audFind('b', 'Biaya tayang', `CPM iPhone ${af2(ip.d.cpm / an.d.cpm)}× Android`, `ROAS iPhone ${af2(ip.d.roas)} vs Android ${af2(an.d.roas)}.`));
    }
    const dif = mrows.filter(r => r.a.p + r.i.p >= 3).map(r => ({ r, g: (r.a.roas || 0) - (r.i.roas || 0) })).sort((a, b) => Math.abs(b.g) - Math.abs(a.g))[0];
    if (dif && Math.abs(dif.g) >= 0.3) finds.push(audFind('b', 'Beda per campaign', `${shortCamp(dif.r.x.n, 40)}: lebih bagus di ${dif.g > 0 ? 'Android' : 'iPhone'}`, `Android ${af2(dif.r.a.roas || 0)}× vs iPhone ${af2(dif.r.i.roas || 0)}×.`));
  }

  if (!finds.length) finds.push(audFind('n', 'Info', 'Belum ada pola yang menonjol', 'Data campaign yang dipilih masih tipis untuk tab ini.'));
  html += `<div class="aud">${rail}<section class="aud-main">${tabs}<div class="aud-f">${finds.slice(0, 3).join('')}</div>${body}${note}</section></div>`;
  return html;
}

async function ensureSeg() {
  if (ST.seg && (Date.now() - ST.seg._at < 30 * 60 * 1000)) return;
  try { ST.seg = await api('segments', { until: addD(todayJkt(), -1) }); } catch (e) { ST.seg = { err: e.message, place: {}, demo: [] }; }
  ST.seg._at = Date.now();
}
/** semua blackhole yang terdeteksi (akun terpilih), urut spend terbesar */
function blackholes() {
  const ds = ST.main; if (!ds) return [];
  const t = todayJkt(), out = [], inAcc = a => ST.acc < 0 || a === ST.acc, MC = {}, mc = a => (MC[a] != null ? MC[a] : (MC[a] = maxCpa(a, ds)));
  // B4 / B7 — campaign
  const maps = dailyMaps(ds, ad => ad.c, addD(t, -31), t, -1);
  entitiesOf('campaign', ds).forEach(e => {
    if (!e.active || !inAcc(e.a)) return;
    if (Brain.sopType(e.n)) {
      const s = Brain.campaignSop(maps[e.id] || {}, { today: t, name: e.n, start: e.start, active: true, budget: campBudget(ds, e.id), budgetEvents: budgetEvents('campaign', e.id, ds) });
      if (s && (s.act === 'kill' || s.act === 'down')) out.push({ code: s.act === 'kill' ? 'B7' : 'B4', lv: 'Campaign', a: e.a, name: shortCamp(e.n), spend: s.m.s7, text: s.reasons[0], camp: e.id });
      return;
    }
    const b = Brain.blackholeEntity(maps[e.id] || {}, { today: t, active: true, maxCpa: mc(e.a) });
    if (b) out.push({ code: b.code, lv: 'Campaign', a: e.a, name: shortCamp(e.n), spend: b.spend, text: b.text, camp: e.id });
  });
  // B1–B3 — iklan
  Object.values(adRules()).forEach(r => {
    const ru = r.rule; if (!ru || ru.key !== 'kill' || !/^B(1b?|2|3)$/.test(ru.code || '') || !inAcc(r.e.a)) return;
    out.push({ code: ru.code, lv: 'Iklan', a: r.e.a, name: r.e.n, sub: shortCamp(r.e.sub || '', 32), spend: ru.m.spend, text: ru.reasons[0] || '', camp: r.e.camp });
  });
  // B5 — penempatan (7 hari penuh), B6 — segmen usia × gender (30 hari penuh)
  const sg = ST.seg;
  if (sg && !sg.err) {
    Object.entries(sg.place || {}).forEach(([cid, pl]) => {
      const c = ds.campaigns[cid]; if (!c || !campActive(c) || !inAcc(c.a)) return;
      Object.entries(pl).forEach(([p, v]) => { if (Brain.blackholePlacement(v, mc(c.a))) out.push({ code: 'B5', lv: 'Penempatan', a: c.a, name: (PLAT[p] || p) + ' di ' + shortCamp(c.n, 30), spend: v[0], camp: cid,
        text: `${rp(v[0])} dalam 7 hari tanpa checkout dan purchase (batas ${rp(Brain.cfg.content.placeMult * mc(c.a))}). Buang penempatan ini dari campaign.` }); });
    });
    (sg.demo || []).forEach((d, a) => {
      if (!inAcc(a)) return;
      Object.entries(d || {}).forEach(([k, v]) => {
        const [g, age] = k.split('|'); if (g === 'unknown' || age === 'Unknown') return;
        if (Brain.blackholeSegment(v, mc(a))) out.push({ code: 'B6', lv: 'Segmen', a, name: (g === 'male' ? 'Pria' : g === 'female' ? 'Wanita' : g) + ' ' + age, spend: v[0],
          text: `${rp(v[0])} dalam 30 hari, ${nf(v[3])} purchase (batas ${rp(Brain.cfg.content.segMult * mc(a))}, ≤ 1 purchase). Kecualikan segmen ini di ad set manual.` });
      });
    });
  }
  return out.sort((p, q) => q.spend - p.spend);
}
function blackholeCard() {

  <tr><td>B2</td><td>Hook gagal</td><td>Link CTR &lt; ${pcx(K.ctrKill)} setelah ${K.earlyImpr.toLocaleString('id-ID')} impresi &amp; ${rp(K.earlySpend)}</td></tr>
  <tr><td>B3</td><td>Trafik sampah: LPV banyak, 0 checkout (30 hari atau 7 hari terakhir)</td><td>LPV ≥ ${k(K.junkMult)} LPV per purchase di closing sehat (${accs.map(a => `<span style="white-space:nowrap">${esc(a.l)} <b>${fin((TH(a.i) || {}).junkLpv) ? Math.round(TH(a.i).junkLpv) : K.junkLpv} LPV</b></span>`).join(' · ')})</td></tr>
  <tr><td>B4</td><td>Campaign kosong beruntun</td><td>Testing/ASC: ${K.zeroCut} hari tanpa purchase → turun ${st}. Lainnya: ≥ 2 hari 0 purchase, spend ≥ ${k(K.zeroMult)} CPA historis</td></tr>
  <tr><td>B5</td><td>Penempatan bocor (7 hari)</td><td>Spend ≥ ${k(K.placeMult)} CPA maks (${v(K.placeMult)}), 0 checkout &amp; 0 purchase</td></tr>
  <tr><td>B6</td><td>Segmen usia × gender bocor (30 hari)</td><td>Spend ≥ ${k(K.segMult)} CPA maks (${v(K.segMult)}), ≤ 1 purchase</td></tr>
  <tr><td>B7</td><td>Campaign jelek</td><td>Testing/ASC: ${K.zeroCut} hari lagi tanpa purchase setelah dipotong (atau ${2 * K.zeroCut} hari kosong beruntun) → matikan, pindah konten bagus ke ASC. Lainnya: 0 purchase ≥ ${K.zeroDays} hari</td></tr>
  </tbody></table></div>
  <h3 style="font-size:15px;margin:18px 0 6px">SOP budget campaign Testing &amp; ASC <span class="small muted" style="font-weight:400">— diputuskan di cek jam 10:00 dengan data s/d kemarin</span></h3>
  <div class="tw"><table class="rtab" style="min-width:640px"><thead><tr><th>Kapan</th><th>Kondisi</th><th>Aksi</th></tr></thead><tbody>
  <tr><td>Hari 1–${K.evalDays[0] - 1}</td><td>Campaign Testing baru (hari ke-1 = tanggal di awal nama, mis. 11Nov26 Testing …)</td><td>Biarkan; aturan per video tetap jalan</td></tr>
  <tr><td>Hari ${K.evalDays.join(', ')}, lalu tiap ${K.evalEvery} hari (ASC: tiap ${K.evalEvery} hari sejak perubahan terakhir)</td><td>ROAS 3D ≥ ${xx(C.minRoas)} &amp; ROAS 7D ≥ ${xx(C.minRoas)}</td><td><b>Naik ${st}</b></td></tr>
  <tr><td>Kapan saja</td><td>${K.zeroCut} hari berturut-turut tanpa purchase</td><td><b>Turun ${st}</b></td></tr>
  <tr><td>Setelah dipotong</td><td>${K.zeroCut} hari lagi tanpa purchase</td><td><b>Matikan</b> + pindah konten bagus ke ASC</td></tr>
  <tr><td>Selain itu</td><td>—</td><td>Tahan</td></tr>
  </tbody></table></div>
  <div class="small muted" style="margin-top:6px">Sebelum mematikan, cek pengecualian di <a href="${RULEBOOK_URL}" target="_blank" rel="noopener">rulebook</a>: winner yang kosong &lt; 2× CPA historis, baru di-scale atau dipindah (&lt; 3 hari), hampir tidak dapat budget, campaign WA yang closing-nya belum terlacak.</div>
  <div class="small muted" style="margin-top:10px">Urutan cek (rulebook v2): kasus 5 → trafik sampah (B3) → CPA lewat batas (B1b) → biaya per lead lewat batas (B1) → belum pernah purchase (hook gagal → diagnosa → testing) → konten bagus → kasus 4 → winner. Dashboard hanya memberi label — tidak mengubah apa pun di akun.</div>`, 'wide pad');
}

/* ---------- settings ---------- */
function openSettings() {
  const ds = ST.main;
  openModal(`<h2 style="font-size:18px">Settings</h2><div class="muted small" style="margin:4px 0 14px">Tersimpan di browser ini.</div>
  <div class="set-grid">
    <div><label>ROAS cutoff (di bawah = Loser)</label><input class="inp" id="sCut" type="number" step="0.1" value="${S.cutoff}"></div>
    <div><label>ROAS minimum (Winner, pertahankan)</label><input class="inp" id="sMin" type="number" step="0.1" value="${S.minRoas}"></div>
    <div><label>ROAS target (Winner, layak scale)</label><input class="inp" id="sTarget" type="number" step="0.1" value="${S.target}"></div>
    <div><label>Umur minimal sebelum evaluasi (hari)</label><input class="inp" id="sAge" type="number" value="${S.minAge}"></div>
    <div><label>Cost per contact maksimal (Rp)</label><input class="inp" id="sCpc" type="number" value="${S.maxCpc}"></div>
    <div style="grid-column:1/-1;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><b style="font-size:14px">Rule konten &amp; SOP (rulebook v2)</b> <span class="small muted">— berlaku untuk semua iklan; SOP budget untuk campaign Testing &amp; ASC</span></div>
    <div><label>B1 · Matikan kalau biaya per lead &gt; (Rp)</label><input class="inp" id="sCpl" type="number" step="10000" value="${S.content.cplKill}"></div>
    <div><label>B1b · Matikan kalau CPA &gt; (Rp) · juga batas konten bagus</label><input class="inp" id="sCpaK" type="number" step="50000" value="${S.content.cpaKill}"></div>
    <div><label>SOP · naik / turun budget (%)</label><input class="inp" id="sStep" type="number" step="1" value="${S.content.stepUp}"></div>
    <div><label>SOP · hari tanpa purchase sebelum turun budget</label><input class="inp" id="sZero" type="number" step="1" value="${S.content.zeroCut}"></div>
    <div><label>Winner kosong masih wajar sampai … × CPA historis</label><input class="inp" id="sStreak" type="number" step="0.1" value="${S.content.streakMult}"></div>
    <div><label>Link CTR "bagus" ≥ (%)</label><input class="inp" id="sCtrG" type="number" step="0.1" value="${S.content.ctrGood}"></div>
    <div><label>Link CTR "hook gagal" &lt; (%)</label><input class="inp" id="sCtrK" type="number" step="0.1" value="${S.content.ctrKill}"></div>
    <div style="grid-column:1/-1;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><b style="font-size:14px">Patokan metrik</b> <span class="small muted">— CPA, cost per contact &amp; closing LP dihitung otomatis dari AOV dan ROAS di atas</span></div>
    <div><label>Closing kontak WA (%) — dipakai kalau data kontak &lt; 30</label><input class="inp" id="mWa" type="number" step="0.5" value="${S.metric.waClose}"></div>
    <div><label>Hook rate (%): minimum · sehat · scale</label><div style="display:flex;gap:6px"><input class="inp" id="mH1" type="number" step="0.1" value="${S.metric.hookMin}"><input class="inp" id="mH2" type="number" step="0.1" value="${S.metric.hookOk}"><input class="inp" id="mH3" type="number" step="0.1" value="${S.metric.hookScale}"></div></div>
    <div><label>LPV rate (%): minimum · sehat · scale</label><div style="display:flex;gap:6px"><input class="inp" id="mL1" type="number" value="${S.metric.lpvMin}"><input class="inp" id="mL2" type="number" value="${S.metric.lpvOk}"><input class="inp" id="mL3" type="number" value="${S.metric.lpvScale}"></div></div>
    ${ds ? ds.accounts.map((a, i) => `<div><label>CPA maks ${esc(a.label)} (kosong = otomatis ${rp(maxCpaAuto(i))})</label><input class="inp" data-mc="${esc(a.label)}" type="number" value="${S.maxCpa[a.label] || ''}"></div>`).join('') : ''}
    <div style="grid-column:1/-1"><label>URL Web App</label><input class="inp" id="sApi" value="${esc(API)}"></div>
    <div style="grid-column:1/-1"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="sAuto" ${S.auto ? 'checked' : ''}> Refresh otomatis setiap 10 menit</label></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn pri" id="saveSet">Simpan</button><button class="btn" id="logoutBtn" style="margin-left:auto">Keluar</button></div>`);
}
function maxCpaAuto(i) { const save = S.maxCpa; S.maxCpa = {}; const v = maxCpa(i, ST.main); S.maxCpa = save; return v; }
function saveSettings() {
  S.cutoff = +$('sCut').value || DEF.cutoff; S.minRoas = +$('sMin').value || DEF.minRoas; S.target = +$('sTarget').value || DEF.target; S.minAge = +$('sAge').value || DEF.minAge;
  S.maxCpc = +$('sCpc').value || DEF.maxCpc; S.auto = $('sAuto').checked;
  const cv = (id, k) => (+$(id).value > 0 ? +$(id).value : DEF.content[k]);
  const mv = (id, k) => (+$(id).value > 0 ? +$(id).value : DEF.metric[k]);
  S.metric = { waClose: mv('mWa', 'waClose'), hookMin: mv('mH1', 'hookMin'), hookOk: mv('mH2', 'hookOk'), hookScale: mv('mH3', 'hookScale'), lpvMin: mv('mL1', 'lpvMin'), lpvOk: mv('mL2', 'lpvOk'), lpvScale: mv('mL3', 'lpvScale') };
  S.content = { killMult: S.content.killMult, lossMult: S.content.lossMult, tofMult: S.content.tofMult, cplKill: cv('sCpl', 'cplKill'), cpaKill: cv('sCpaK', 'cpaKill'), stepUp: cv('sStep', 'stepUp'), zeroCut: cv('sZero', 'zeroCut'), streakMult: cv('sStreak', 'streakMult'), ctrGood: cv('sCtrG', 'ctrGood'), ctrKill: cv('sCtrK', 'ctrKill') };
  S.maxCpa = {}; document.querySelectorAll('.mar-app [data-mc]').forEach(i => { if (+i.value) S.maxCpa[i.dataset.mc] = +i.value; });
  LS.set('settings', S); applyBrain();
  const na = $('sApi').value.trim(); if (na && na !== API) { API = na; LS.set('api', API); closeModal(); return logout(); }
  closeModal(); toast('Pengaturan disimpan'); render();
}

/* ---------- auth ---------- */
async function doLogin() {
  const pw = $('pwInp').value, ai = $('apiInp').value.trim();
  if (ai) API = ai;
  $('loginErr').textContent = '';
  if (!API) { $('loginErr').textContent = 'Isi URL Web App dulu'; return; }
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Memeriksa…';
  try { SESSION = null; const r = await api('login', { password: pw }); SESSION = r.session; LS.set('session', SESSION); LS.set('api', API); start(); }
  catch (e) { $('loginErr').textContent = e.message; }
  $('loginBtn').disabled = false; $('loginBtn').textContent = 'Masuk';
}
function logout() { SESSION = null; LS.del('session'); ST.main = null; $('shell').hidden = true; $('login').hidden = false; $('apiInp').value = API || ''; $('apiWrap').hidden = !!CONFIG.API_URL; }
function start() { $('login').hidden = true; $('shell').hidden = false; loadMain(false); }


setSidebar(!!LS.get('sbc', false));
setInterval(() => { if (S.auto && SESSION && ST.main && !document.hidden && !ST.busy) loadMain(false); }, 10 * 60 * 1000);
setInterval(updLabel, 60 * 1000);
if (SESSION && API) start(); else logout();
</script>
</body>
</html>
